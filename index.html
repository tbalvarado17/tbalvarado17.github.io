<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradison Calendar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #9BD1F2;
        }

        h1 {
            text-align: center;
        }

        .calendar-container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.15);
        }

        iframe {
            width: 100%;
            height: 700px;
            border: 0;
        }
    </style>
</head>
<body>

<div class="carousel-wrapper">
  <!-- Radio buttons control which slide is active -->
  <input type="radio" name="carousel-slide" id="slide-1" checked>
  <input type="radio" name="carousel-slide" id="slide-2">
  <input type="radio" name="carousel-slide" id="slide-3">

  <!-- Main slider track containing images -->
  <div class="carousel-track">
    <div class="carousel-item"><img src="IMG_0016.JPG" alt="Slide 1"></div>
    <div class="carousel-item"><img src="IMG_0024.JPG" alt="Slide 2"></div>
    <div class="carousel-item"><img src="IMG_0039.JPG" alt="Slide 3"></div>
  </div>

  <!-- Arrow navigation buttons -->
  <div class="carousel-arrows">
    <div class="arrow-set set-1">
      <label for="slide-3" class="prev-arrow">&#10094;</label>
      <label for="slide-2" class="next-arrow">&#10095;</label>
    </div>
    <div class="arrow-set set-2">
      <label for="slide-1" class="prev-arrow">&#10094;</label>
      <label for="slide-3" class="next-arrow">&#10095;</label>
    </div>
    <div class="arrow-set set-3">
      <label for="slide-2" class="prev-arrow">&#10094;</label>
      <label for="slide-1" class="next-arrow">&#10095;</label>
    </div>
  </div>

  <!-- Bottom dot navigation indicators -->
  <div class="carousel-dots">
    <label for="slide-1" class="dot-indicator"></label>
    <label for="slide-2" class="dot-indicator"></label>
    <label for="slide-3" class="dot-indicator"></label>
  </div>
</div>


<br>


    
<div class="calendar-container">
    
    <h1>Welcome to Camp Gradison at Torch Lake!</h1>
    
    <h1>(Picture slideshow here of photos)</h1>

    <h1><img src="IMG_0016.JPG" width="500" height="500"></h1>
    <h1><img src="IMG_0024.JPG" width="800" height="600"></h1>
    <h1><img src="IMG_0039.JPG" width="500" height="600"></h1>
    <h1><img src="IMG_4088.JPG" width="500" height="600"></h1>


    <h1>Gradison Torch Lake Shared Calendar</h1>

    <iframe
        src="https://calendar.google.com/calendar/embed?src=802c89afb682d9dd4c980ca252ea077cd63e4ebb1567a5963a0b2c11cfcfa6f6@group.calendar.google.com">
    </iframe>

</div>

</body>
</html>
